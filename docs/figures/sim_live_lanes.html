<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Offline simulation and live operations</title>
  <link rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&display=swap">
  <link rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&display=swap">
  <link rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&display=swap">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Geist', system-ui, sans-serif;
      background: #ffffff;
      color: #2d3142;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }
    .frame { max-width: 1200px; width: 100%; }
    .eyebrow {
      font-family: 'Geist Mono', ui-monospace, monospace;
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: #4f5d75;
      margin-bottom: 0.5rem;
    }
    h1 {
      font-family: 'Instrument Serif', serif;
      font-size: 2rem;
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: #2d3142;
      margin-bottom: 1.5rem;
    }
    svg { width: 100%; max-width: 720px; margin: 0 auto; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Swimlane, fyst-trajectories</p>
    <h1>Offline simulation and live operations</h1>

    <svg viewBox="0 0 720 560" xmlns="http://www.w3.org/2000/svg" role="img"
      aria-labelledby="sim-live-lanes-title sim-live-lanes-desc">
      <title
        id="sim-live-lanes-title">Offline simulation lane beside the live operations lane</title>
      <desc id="sim-live-lanes-desc">
        Offline, ObservingPatch objects become an ObservingTimeline through generate_timeline(),
        which write_timeline() saves as schedule.ecsv for coverage-simulation tooling; live, for
        Prime-Cam, a long-term schedule feeds the observatory scheduling layer, which dispatches
        the typed scan tasks (each calling plan_*_scan at dispatch) to the ACU agent, the telescope
        control system and the ACU.
      </desc>
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3"
          orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3"
          orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
        <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3"
          orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#ffffff"/>

      <line x1="40" y1="40" x2="680" y2="40" stroke="rgba(45,49,66,0.22)" stroke-width="1"/>
      <line x1="40" y1="104" x2="680" y2="104" stroke="rgba(45,49,66,0.10)" stroke-width="1"/>
      <line x1="40" y1="520" x2="680" y2="520" stroke="rgba(45,49,66,0.22)" stroke-width="1"/>
      <line x1="360" y1="40" x2="360" y2="520" stroke="rgba(45,49,66,0.22)" stroke-width="1"/>
      <text x="56" y="64" fill="#4f5d75" font-size="9" font-weight="500"
        font-family="'Geist Mono', monospace" letter-spacing="0.18em">OFFLINE SIM LANE</text>
      <text x="56" y="84" fill="#7a8399" font-size="12"
        font-family="'Geist', sans-serif">where this subpackage lives</text>
      <text x="376" y="64" fill="#4f5d75" font-size="9" font-weight="500"
        font-family="'Geist Mono', monospace" letter-spacing="0.18em">LIVE OPS LANE</text>
      <text x="376" y="84" fill="#7a8399" font-size="12"
        font-family="'Geist', sans-serif">Prime-Cam: what drives the telescope</text>
      <line x1="200" y1="176" x2="200" y2="206" stroke="#4f5d75" stroke-width="1.2"
        marker-end="url(#arrow)"/>
      <line x1="200" y1="256" x2="200" y2="286" stroke="#4f5d75" stroke-width="1.2"
        marker-end="url(#arrow)"/>
      <line x1="200" y1="336" x2="200" y2="366" stroke="#4f5d75" stroke-width="1.2"
        marker-end="url(#arrow)"/>
      <line x1="520" y1="176" x2="520" y2="198" stroke="#4f5d75" stroke-width="1.2"
        marker-end="url(#arrow)"/>
      <line x1="520" y1="264" x2="520" y2="286" stroke="#4f5d75" stroke-width="1.2"
        marker-end="url(#arrow)"/>
      <line x1="520" y1="336" x2="520" y2="366" stroke="#4f5d75" stroke-width="1.2"
        marker-end="url(#arrow)"/>
      <line x1="520" y1="416" x2="520" y2="446" stroke="#4f5d75" stroke-width="1.2"
        marker-end="url(#arrow)"/>
      <rect x="80" y="128" width="240" height="48" rx="6" fill="#ffffff"/>
      <rect x="80" y="128" width="240" height="48" rx="6" fill="#ffffff" stroke="#2d3142"
        stroke-width="1"/>
      <text x="200" y="156" fill="#2d3142" font-size="12" font-weight="600"
        font-family="'Geist', sans-serif" text-anchor="middle">ObservingPatch objects</text>
      <rect x="80" y="208" width="240" height="48" rx="6" fill="#ffffff"/>
      <rect x="80" y="208" width="240" height="48" rx="6" fill="rgba(235,108,54,0.08)"
        stroke="#eb6c36" stroke-width="1"/>
      <text x="200" y="230" fill="#2d3142" font-size="12" font-weight="600"
        font-family="'Geist', sans-serif" text-anchor="middle">ObservingTimeline</text>
      <text x="200" y="244" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace"
        text-anchor="middle">generate_timeline()</text>
      <rect x="80" y="288" width="240" height="48" rx="6" fill="#ffffff"/>
      <rect x="80" y="288" width="240" height="48" rx="6" fill="#ffffff" stroke="#2d3142"
        stroke-width="1"/>
      <text x="200" y="310" fill="#2d3142" font-size="12" font-weight="600"
        font-family="'Geist', sans-serif" text-anchor="middle">schedule.ecsv</text>
      <text x="200" y="324" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace"
        text-anchor="middle">write_timeline()</text>
      <rect x="80" y="368" width="240" height="48" rx="6" fill="#ffffff"/>
      <rect x="80" y="368" width="240" height="48" rx="6" fill="#ffffff" stroke="#2d3142"
        stroke-width="1"/>
      <text x="200" y="390" fill="#2d3142" font-size="12" font-weight="600"
        font-family="'Geist', sans-serif" text-anchor="middle">Coverage-simulation tooling</text>
      <text x="200" y="404" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace"
        text-anchor="middle">hitmaps, coverage and cadence studies</text>
      <rect x="384" y="128" width="272" height="48" rx="6" fill="#ffffff"/>
      <rect x="384" y="128" width="272" height="48" rx="6" fill="#ffffff" stroke="#2d3142"
        stroke-width="1"/>
      <text x="520" y="156" fill="#2d3142" font-size="12" font-weight="600"
        font-family="'Geist', sans-serif" text-anchor="middle">Long-term schedule</text>
      <rect x="384" y="200" width="272" height="64" rx="6" fill="#ffffff"/>
      <rect x="384" y="200" width="272" height="64" rx="6" fill="#ffffff" stroke="#2d3142"
        stroke-width="1"/>
      <text x="520" y="224" fill="#2d3142" font-size="12" font-weight="600"
        font-family="'Geist', sans-serif" text-anchor="middle">Observatory scheduling layer</text>
      <text x="520" y="238" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace"
        text-anchor="middle">dispatches the typed scan tasks;</text>
      <text x="520" y="250" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace"
        text-anchor="middle">each calls plan_*_scan at dispatch</text>
      <rect x="384" y="288" width="272" height="48" rx="6" fill="#ffffff"/>
      <rect x="384" y="288" width="272" height="48" rx="6" fill="#ffffff" stroke="#2d3142"
        stroke-width="1"/>
      <text x="520" y="316" fill="#2d3142" font-size="12" font-weight="600"
        font-family="'Geist', sans-serif" text-anchor="middle">ACU agent</text>
      <rect x="384" y="368" width="272" height="48" rx="6" fill="#ffffff"/>
      <rect x="384" y="368" width="272" height="48" rx="6" fill="#ffffff" stroke="#2d3142"
        stroke-width="1"/>
      <text x="520" y="396" fill="#2d3142" font-size="12" font-weight="600"
        font-family="'Geist', sans-serif" text-anchor="middle">Telescope control system</text>
      <rect x="384" y="448" width="272" height="48" rx="6" fill="#ffffff"/>
      <rect x="384" y="448" width="272" height="48" rx="6" fill="#ffffff" stroke="#2d3142"
        stroke-width="1"/>
      <text x="520" y="476" fill="#2d3142" font-size="12" font-weight="600"
        font-family="'Geist', sans-serif" text-anchor="middle">ACU</text>
    </svg>
  </div>
</body>
</html>
