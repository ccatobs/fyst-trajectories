<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The slew onto a science scan</title>
  <link rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&display=swap">
  <link rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&display=swap">
  <link rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&display=swap">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:  #ffffff;
      --color-ink:    #2d3142;
      --color-muted:  #4f5d75;
      --color-accent: #eb6c36;
      --font-sans:    'Geist', system-ui, sans-serif;
      --font-serif:   'Instrument Serif', serif;
      --font-mono:    'Geist Mono', ui-monospace, monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }
    .frame { max-width: 720px; width: 100%; }
    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }
    svg { width: 100%; min-width: 720px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Offline simulator, fyst-trajectories</p>
    <h1>The slew onto a science scan</h1>

    <svg viewBox="0 0 720 280" xmlns="http://www.w3.org/2000/svg" role="img"
      aria-labelledby="slew-onto-scan-title slew-onto-scan-desc">
      <title id="slew-onto-scan-title">The slew onto a science scan</title>
      <desc id="slew-onto-scan-desc">
        Telescope azimuth against time for one simulated constant-elevation visit. The slew ends
        at the scan's first sample; the telescope waits there through any hold and the retune, and
        the scan begins where the telescope already is.
      </desc>

      <rect width="100%" height="100%" fill="#ffffff"/>

      <!-- Axes, block boundaries and block names -->
      <line x1="64" y1="52" x2="64" y2="200" stroke="#4f5d75" stroke-width="1"/>
      <line x1="64" y1="200" x2="696" y2="200" stroke="#4f5d75" stroke-width="1"/>
      <line x1="120" y1="196" x2="120" y2="204" stroke="#4f5d75" stroke-width="1"/>
      <line x1="288" y1="196" x2="288" y2="204" stroke="#4f5d75" stroke-width="1"/>
      <line x1="508" y1="196" x2="508" y2="204" stroke="#4f5d75" stroke-width="1"/>
      <text x="72" y="60" fill="#4f5d75" font-size="9"
        font-family="'Geist Mono', monospace">azimuth</text>
      <text x="696" y="216" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace"
        text-anchor="end">time</text>
      <text x="204" y="216" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace"
        text-anchor="middle">slew, then any hold</text>
      <text x="398" y="216" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace"
        text-anchor="middle">retune</text>
      <text x="602" y="216" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace"
        text-anchor="middle">science scan</text>

      <!-- The telescope: waiting, the slew, the wait at the first sample, the scan -->
      <polyline points="64,180 120,180 268,68 508,68 636,172 696,123" fill="none"
        stroke="#2d3142" stroke-width="1.6" stroke-linejoin="round"/>
      <circle cx="268" cy="68" r="3" fill="#eb6c36"/>
      <circle cx="508" cy="68" r="3" fill="#eb6c36"/>

      <text x="276" y="56" fill="#2d3142" font-size="9"
        font-family="'Geist Mono', monospace">the telescope waits at the scan's first sample</text>
      <text x="270" y="86" fill="#4f5d75" font-size="9"
        font-family="'Geist Mono', monospace">hold, if any</text>

      <!-- Scale note -->
      <text x="24" y="248" fill="#2d3142" font-size="12" font-style="italic"
        font-family="'Instrument Serif', serif">Not to scale: a slew lasts tens of seconds, any hold at most a few seconds, and the retune minutes.</text>
    </svg>
  </div>
</body>
</html>
