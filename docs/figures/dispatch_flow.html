<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dispatching to the telescope</title>
  <link rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&display=swap">
  <link rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&display=swap">
  <link rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&display=swap">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Geist', system-ui, sans-serif;
      background: #ffffff;
      color: #2d3142;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }
    .frame { max-width: 1200px; width: 100%; }
    .eyebrow {
      font-family: 'Geist Mono', ui-monospace, monospace;
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: #4f5d75;
      margin-bottom: 0.5rem;
    }
    h1 {
      font-family: 'Instrument Serif', serif;
      font-size: 2rem;
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: #2d3142;
      margin-bottom: 1.5rem;
    }
    svg { width: 100%; max-width: 720px; margin: 0 auto; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Flow, fyst-trajectories</p>
    <h1>Dispatching to the telescope</h1>

    <svg viewBox="0 0 720 256" xmlns="http://www.w3.org/2000/svg" role="img"
      aria-labelledby="dispatch-flow-title dispatch-flow-desc">
      <title id="dispatch-flow-title">Dispatching a scan to the telescope</title>
      <desc id="dispatch-flow-desc">
        The scheduling layer passes scan_params to a typed scan task such as pong_scan; the task
        calls fyst-trajectories (plan_pong_scan and to_path_payload), which returns the trajectory
        payload, and the task sends it by HTTP POST to /path to the Go TCS, which drives the ACU
        hardware.
      </desc>
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3"
          orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3"
          orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
        <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3"
          orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#ffffff"/>

      <line x1="180" y1="72" x2="258" y2="72" stroke="#4f5d75" stroke-width="1.2"
        marker-end="url(#arrow)"/>
      <line x1="420" y1="60" x2="518" y2="60" stroke="#4f5d75" stroke-width="1.2"
        marker-end="url(#arrow)"/>
      <line x1="520" y1="84" x2="422" y2="84" stroke="#4f5d75" stroke-width="1"
        stroke-dasharray="4,3" marker-end="url(#arrow)"/>
      <line x1="340" y1="104" x2="340" y2="166" stroke="#4f5d75" stroke-width="1.2"
        marker-end="url(#arrow)"/>
      <line x1="420" y1="192" x2="518" y2="192" stroke="#4f5d75" stroke-width="1.2"
        marker-end="url(#arrow)"/>
      <rect x="188" y="52" width="64" height="12" rx="2" fill="#ffffff"/>
      <text x="220" y="61" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace"
        text-anchor="middle" letter-spacing="0.06em">scan_params</text>
      <rect x="452" y="40" width="36" height="12" rx="2" fill="#ffffff"/>
      <text x="470" y="49" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace"
        text-anchor="middle" letter-spacing="0.06em">call</text>
      <rect x="444" y="92" width="52" height="12" rx="2" fill="#ffffff"/>
      <text x="470" y="101" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace"
        text-anchor="middle" letter-spacing="0.06em">payload</text>
      <rect x="348" y="128" width="88" height="12" rx="2" fill="#ffffff"/>
      <text x="392" y="137" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace"
        text-anchor="middle" letter-spacing="0.06em">HTTP POST /path</text>
      <rect x="40" y="40" width="140" height="64" rx="6" fill="#ffffff"/>
      <rect x="40" y="40" width="140" height="64" rx="6" fill="#ffffff" stroke="#2d3142"
        stroke-width="1"/>
      <text x="110" y="76" fill="#2d3142" font-size="12" font-weight="600"
        font-family="'Geist', sans-serif" text-anchor="middle">Scheduling layer</text>
      <rect x="260" y="40" width="160" height="64" rx="6" fill="#ffffff"/>
      <rect x="260" y="40" width="160" height="64" rx="6" fill="#ffffff" stroke="#2d3142"
        stroke-width="1"/>
      <text x="340" y="70" fill="#2d3142" font-size="12" font-weight="600"
        font-family="'Geist', sans-serif" text-anchor="middle">Typed scan task</text>
      <text x="340" y="84" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace"
        text-anchor="middle">e.g. pong_scan</text>
      <rect x="520" y="40" width="160" height="64" rx="6" fill="#ffffff"/>
      <rect x="520" y="40" width="160" height="64" rx="6" fill="rgba(235,108,54,0.08)"
        stroke="#eb6c36" stroke-width="1"/>
      <text x="600" y="64" fill="#2d3142" font-size="12" font-weight="600"
        font-family="'Geist', sans-serif" text-anchor="middle">fyst-trajectories</text>
      <text x="600" y="78" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace"
        text-anchor="middle">plan_pong_scan +</text>
      <text x="600" y="90" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace"
        text-anchor="middle">to_path_payload</text>
      <rect x="260" y="168" width="160" height="48" rx="6" fill="#ffffff"/>
      <rect x="260" y="168" width="160" height="48" rx="6" fill="#ffffff" stroke="#2d3142"
        stroke-width="1"/>
      <text x="340" y="196" fill="#2d3142" font-size="12" font-weight="600"
        font-family="'Geist', sans-serif" text-anchor="middle">Go TCS</text>
      <rect x="520" y="168" width="160" height="48" rx="6" fill="#ffffff"/>
      <rect x="520" y="168" width="160" height="48" rx="6" fill="#ffffff" stroke="#2d3142"
        stroke-width="1"/>
      <text x="600" y="196" fill="#2d3142" font-size="12" font-weight="600"
        font-family="'Geist', sans-serif" text-anchor="middle">ACU hardware</text>
    </svg>
  </div>
</body>
</html>
