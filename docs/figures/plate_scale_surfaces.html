<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Two image surfaces, two plate scales</title>
  <link rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&display=swap">
  <link rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&display=swap">
  <link rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&display=swap">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:  #ffffff;
      --color-ink:    #2d3142;
      --color-muted:  #4f5d75;
      --color-accent: #eb6c36;
      --font-sans:    'Geist', system-ui, sans-serif;
      --font-serif:   'Instrument Serif', serif;
      --font-mono:    'Geist Mono', ui-monospace, monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }
    .frame { max-width: 720px; width: 100%; }
    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }
    svg { width: 100%; min-width: 720px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Optics, fyst-trajectories</p>
    <h1>Two image surfaces, two plate scales</h1>

    <svg viewBox="0 0 720 256" xmlns="http://www.w3.org/2000/svg" role="img"
      aria-labelledby="plate-scale-surfaces-title plate-scale-surfaces-desc">
      <title id="plate-scale-surfaces-title">Two image surfaces, two plate scales</title>
      <desc id="plate-scale-surfaces-desc">
        Light path from the FYST mirrors to the telescope focal surface, where the Prime-Cam
        modules sit at 13.89 arcsec per mm and the library converts the 461.3 mm ring radius into
        1.78 degrees, then through a module's reimaging optics to its detector plane, which has its
        own larger plate scale that the library does not carry.
      </desc>
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3"
          orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3"
          orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
        <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3"
          orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#ffffff"/>

      <!-- Light path, left to right; every endpoint shares y = 72 -->
      <line x1="160" y1="72" x2="200" y2="72" stroke="#4f5d75" stroke-width="1.2"
        marker-end="url(#arrow)"/>
      <line x1="360" y1="72" x2="400" y2="72" stroke="#4f5d75" stroke-width="1.2"
        marker-end="url(#arrow)"/>
      <line x1="536" y1="72" x2="576" y2="72" stroke="#4f5d75" stroke-width="1.2"
        marker-end="url(#arrow)"/>

      <!-- Leaders from the two surfaces to their notes -->
      <line x1="280" y1="104" x2="280" y2="124" stroke="#4f5d75" stroke-width="1"/>
      <line x1="636" y1="104" x2="636" y2="124" stroke="#4f5d75" stroke-width="1"/>

      <!-- FYST mirrors -->
      <rect x="24" y="40" width="136" height="64" rx="6" fill="#ffffff"/>
      <rect x="24" y="40" width="136" height="64" rx="6" fill="#ffffff" stroke="#2d3142"
        stroke-width="1"/>
      <text x="92" y="70" fill="#2d3142" font-size="12" font-weight="600"
        font-family="'Geist', sans-serif" text-anchor="middle">FYST mirrors</text>
      <text x="92" y="84" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace"
        text-anchor="middle">6 m dish</text>

      <!-- Telescope focal surface (the library's plate scale) -->
      <rect x="200" y="40" width="160" height="64" rx="6" fill="#ffffff"/>
      <rect x="200" y="40" width="160" height="64" rx="6" fill="rgba(235,108,54,0.08)"
        stroke="#eb6c36" stroke-width="1"/>
      <text x="280" y="64" fill="#2d3142" font-size="12" font-weight="600"
        font-family="'Geist', sans-serif" text-anchor="middle">Telescope focal surface</text>
      <text x="280" y="78" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace"
        text-anchor="middle">13.89 arcsec/mm</text>
      <text x="280" y="90" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace"
        text-anchor="middle">FYST_PLATE_SCALE</text>

      <!-- Module reimaging optics -->
      <rect x="400" y="40" width="136" height="64" rx="6" fill="#ffffff"/>
      <rect x="400" y="40" width="136" height="64" rx="6" fill="#ffffff" stroke="#2d3142"
        stroke-width="1"/>
      <text x="468" y="70" fill="#2d3142" font-size="12" font-weight="600"
        font-family="'Geist', sans-serif" text-anchor="middle">Reimaging optics</text>
      <text x="468" y="84" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace"
        text-anchor="middle">inside each module</text>

      <!-- Detector plane (a module's own plate scale) -->
      <rect x="576" y="40" width="120" height="64" rx="6" fill="#ffffff"/>
      <rect x="576" y="40" width="120" height="64" rx="6" fill="rgba(235,108,54,0.08)"
        stroke="#eb6c36" stroke-width="1"/>
      <text x="636" y="64" fill="#2d3142" font-size="12" font-weight="600"
        font-family="'Geist', sans-serif" text-anchor="middle">Detector plane</text>
      <text x="636" y="78" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace"
        text-anchor="middle">its own, larger</text>
      <text x="636" y="90" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace"
        text-anchor="middle">plate scale</text>

      <!-- Notes under the two surfaces -->
      <text x="280" y="140" fill="#2d3142" font-size="9" font-family="'Geist Mono', monospace"
        text-anchor="middle">the library's one use of a plate scale:</text>
      <text x="280" y="152" fill="#2d3142" font-size="9" font-family="'Geist Mono', monospace"
        text-anchor="middle">461.3 mm ring radius × 13.89 arcsec/mm</text>
      <text x="280" y="164" fill="#2d3142" font-size="9" font-family="'Geist Mono', monospace"
        text-anchor="middle">= 1.78° to each inner-ring module</text>
      <text x="636" y="140" fill="#2d3142" font-size="9" font-family="'Geist Mono', monospace"
        text-anchor="middle">not carried by this library;</text>
      <text x="636" y="152" fill="#2d3142" font-size="9" font-family="'Geist Mono', monospace"
        text-anchor="middle">positions on a detector wafer</text>
      <text x="636" y="164" fill="#2d3142" font-size="9" font-family="'Geist Mono', monospace"
        text-anchor="middle">need this surface's scale</text>

      <!-- The one relation -->
      <text x="24" y="208" fill="#2d3142" font-size="12" font-style="italic"
        font-family="'Instrument Serif', serif">Plate scale is 206265 divided by the focal length, in arcseconds of sky per millimetre of image.</text>
      <text x="24" y="226" fill="#2d3142" font-size="12" font-style="italic"
        font-family="'Instrument Serif', serif">The reimaging optics shorten the focal length, so the same sky spans fewer millimetres on the wafer than at the telescope's focus.</text>
    </svg>
  </div>
</body>
</html>
