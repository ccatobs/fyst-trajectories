[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fyst-trajectories"
dynamic = ["version"]
description = "Telescope trajectory generation, scan planning, and pointing utilities for the Fred Young Submillimeter Telescope (FYST)"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "Graham Gibson" },
]
license = "BSD-3-Clause"
license-files = ["LICENSE"]
keywords = [
    "astronomy",
    "telescope",
    "FYST",
    "CCAT",
    "submillimeter",
    "trajectory",
    "scan-pattern",
    "observation-planning",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Astronomy",
]
dependencies = [
    "astropy>=5.0",
    "numpy>=1.20",
    "pyyaml>=6.0",
    "scipy>=1.9",
]

[project.optional-dependencies]
performance = [
    "numba>=0.57",
]
plotting = [
    "matplotlib>=3.5",
]
ephemeris = [
    "jplephem>=2.18",
]
overhead = [
    "healpy>=1.16",
]
docs = [
    "sphinx>=8,<9",
    "sphinx-rtd-theme>=2.0",
    "sphinx-autodoc-typehints>=3,<3.6",
    "matplotlib>=3.5",
]
dev = [
    "matplotlib>=3.5",
    "numba>=0.57",
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "ruff>=0.9",
    "pylint>=4.0",
    "skyfield>=1.45",
    "jplephem>=2.18",
    "hypothesis>=6.0",
    "pre-commit>=3.0",
]
all = [
    "fyst-trajectories[ephemeris,plotting,docs,dev,performance,overhead]",
]

[project.urls]
Homepage = "https://github.com/ccatobs/fyst-trajectories"
Documentation = "https://fyst-trajectories.readthedocs.io/"
Repository = "https://github.com/ccatobs/fyst-trajectories"
"Bug Tracker" = "https://github.com/ccatobs/fyst-trajectories/issues"

[tool.hatch.version]
path = "src/fyst_trajectories/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/fyst_trajectories"]

[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/tests",
    "/examples",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
markers = [
    "slow: marks tests as slow (run with --run-slow)",
]
filterwarnings = [
    "ignore::fyst_trajectories.exceptions.PointingWarning",
    # conftest.py pins a vendored IERS table (tests/data/finals2000A.all); a few
    # cross-validation epochs land just past its range and warn. Benign: the
    # affected test is a round-trip where the EOP term cancels.
    "ignore:Tried to get polar motions for times after IERS data is valid:astropy.utils.exceptions.AstropyWarning",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "D"]
ignore = ["D100", "D104", "D105"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D102", "D103"]
"src/fyst_trajectories/patterns/*.py" = ["D102"]

[tool.ruff.format]
docstring-code-format = true

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.pylint.messages_control]
# Pylint supplements ruff (the enforced gate) with inference-based checks
# ruff does not have; run `python -m pylint src/fyst_trajectories` and treat
# errors as review findings. Categories that structurally conflict with this
# codebase's style are disabled so the remaining output is signal:
# - no-member: astropy.units uses dynamic attributes
# - design metrics: NumPy-style planners take many keyword arguments by
#   design, and frozen dataclass value types have few methods
# - duplicate-code: sibling planners/patterns share deliberate structure
# - import-outside-toplevel: deliberate lazy imports (the matplotlib
#   boundary in visualization/, cycle-avoiding leaf imports)
# - line-too-long: ruff owns line length (they disagree only on lines
#   whose overage is a trailing pragma comment, which ruff exempts)
# - fixme: TODOs are tracked in the repo docs, not by lint
disable = [
    "no-member",
    "too-many-arguments",
    "too-many-positional-arguments",
    "too-many-locals",
    "too-many-branches",
    "too-many-statements",
    "too-many-instance-attributes",
    "too-few-public-methods",
    "duplicate-code",
    "import-outside-toplevel",
    "line-too-long",
    "fixme",
]
